name: Numerical contracts
on: [push, pull_request]
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/verify_article_evidence.py
      # Real GSLIB integration is a separate local test; executables are not bundled.
